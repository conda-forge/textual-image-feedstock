context:
  version: "0.14.0"
  python_min: "3.12"

package:
  name: textual-image
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/textual-image/textual_image-${{ version }}.tar.gz
    sha256: 230e2c38738a3d96ca3bcf99c6680b898917003bb21bd5fa7e22cbb16e843235

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build ~=0.11
    - pip
  run:
    - python >=${{ python_min }}
    - pillow >=10.3.0
    - rich >=13.4.0

tests:
  - python:
      imports:
        - textual_image
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lnqs/textual-image
  summary: Render images via Kitty's Terminal Graphics Protocol with Rich and Textual
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - claudiushaag
