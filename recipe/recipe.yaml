context:
  version: "0.14.3"
  python_min: "3.12"

package:
  name: textual-image
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/textual-image/textual_image-${{ version }}.tar.gz
    sha256: 5e8ec5be9a314db7021fbedef663c978b0c59eab346dacf7d49ede6004a8bbbc

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build ~=0.11
    - pip
  run:
    - python >=${{ python_min }}
    - pillow >=10.3.0
    - rich >=13.4.0

tests:
  - python:
      imports:
        - textual_image
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lnqs/textual-image
  summary: Render images via Kitty's Terminal Graphics Protocol with Rich and Textual
  license: LGPL-3.0-only
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - claudiushaag
