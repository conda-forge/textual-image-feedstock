context:
  version: "0.13.1"
  python_min: "3.12"

package:
  name: textual-image
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/textual-image/textual_image-${{ version }}.tar.gz
    sha256: 12e4db28474afd7217ee40f931a9d09af4535f02e55831bb7153cf603fffd520

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pillow >=10.3.0
    - rich >=13.4.0

tests:
  - python:
      imports:
        - textual_image
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/lnqs/textual-image
  summary: Render images via Kitty's Terminal Graphics Protocol with Rich and Textual
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - claudiushaag
